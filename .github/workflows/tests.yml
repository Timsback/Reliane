name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python fetch_assets.py
      - run: python -m unittest discover -s tests -v
